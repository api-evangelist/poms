name: POMS
description: >-
  POMS Corporation develops POMSnet Aquila, a Manufacturing Execution System
  (MES) purpose-built for pharmaceutical, biotech, cell and gene therapy, and
  medical device manufacturers. The platform delivers FDA-compliant electronic
  batch records (EBR), production execution, review-by-exception, and plant-floor
  integration with ERP and equipment systems, deployed on-premise or in the
  cloud. POMS also offers the POMSnet Falcon EBR analytics dashboards. Founded
  around its first MES implementation in 1988 and headquartered in Redmond,
  Washington, POMS sells enterprise software to regulated life-sciences
  manufacturers rather than publishing a public developer API. Surfaced as an
  Insight Partners portfolio lead, this profile is enriched from the company's
  public web presence; no public API, OpenAPI, or developer portal was found.
